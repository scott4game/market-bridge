name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build:web && npm run check:web
      - run: git diff --exit-code -- internal/localclient/ui/formula-worker.js
      - run: go test -race ./...
      - run: go vet ./...
      - run: bash -n scripts/*.sh scripts/lib/*.sh deploy/*.sh
      - run: cp .env.example .env
      - run: docker compose --profile server config -q
      - run: docker compose --profile local config -q
      - run: docker compose --env-file .env.server.example -f deploy/compose.server.yaml config -q
      - run: docker compose --env-file .env.client.example -f deploy/compose.client.yaml config -q

  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [go-server, go-client]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
