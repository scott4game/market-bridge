services:
  go-server:
    profiles: [server]
    image: market-bridge-server:${IMAGE_TAG:-local}
    build:
      context: .
      target: go-server
    environment:
      GO_SERVER_LISTEN: :17601
      GO_SERVER_DATA_DIR: /data
      GO_SERVER_PROVIDER: ${GO_SERVER_PROVIDER:-mock}
      GO_SERVER_INDEX_PROVIDER: ${GO_SERVER_INDEX_PROVIDER:-disabled}
      GO_SERVER_DATA_VERSION: ${GO_SERVER_DATA_VERSION:-mock-v1}
      GO_SERVER_DATASET_TTL: ${GO_SERVER_DATASET_TTL:-24h}
      GO_SERVER_DATASET_WORKERS: ${GO_SERVER_DATASET_WORKERS:-2}
      GO_SERVER_DATASET_QUEUE_SIZE: ${GO_SERVER_DATASET_QUEUE_SIZE:-100}
      GO_SERVER_TOKEN: ${GO_SERVER_TOKEN:?set GO_SERVER_TOKEN in .env}
      MASSIVE_API_KEY: ${MASSIVE_API_KEY:-}
      MASSIVE_PLAN_NAME: ${MASSIVE_PLAN_NAME:-stocks_basic}
      MASSIVE_REQUESTS_PER_MINUTE: ${MASSIVE_REQUESTS_PER_MINUTE:-5}
      MASSIVE_REQUESTS_PER_MONTH: ${MASSIVE_REQUESTS_PER_MONTH:-0}
      GO_SERVER_A_SHARE_PROVIDER: ${GO_SERVER_A_SHARE_PROVIDER:-}
      GO_SERVER_HK_PROVIDER: ${GO_SERVER_HK_PROVIDER:-}
      TUSHARE_TOKEN: ${TUSHARE_TOKEN:-}
      TUSHARE_BASE_URL: ${TUSHARE_BASE_URL:-https://api.tushare.pro}
      TUSHARE_REQUESTS_PER_MINUTE: ${TUSHARE_REQUESTS_PER_MINUTE:-200}
      GO_SERVER_NEWS_PROVIDER: ${GO_SERVER_NEWS_PROVIDER:-disabled}
      FMP_API_KEY: ${FMP_API_KEY:-}
      FMP_BASE_URL: ${FMP_BASE_URL:-https://financialmodelingprep.com}
      FMP_NEWS_POLL_INTERVAL: ${FMP_NEWS_POLL_INTERVAL:-60s}
      GO_SERVER_NEWS_RETENTION: ${GO_SERVER_NEWS_RETENTION:-720h}
      GO_SERVER_LIVE_PROVIDER: ${GO_SERVER_LIVE_PROVIDER:-mock}
      GO_SERVER_LIVE_PROVIDERS: ${GO_SERVER_LIVE_PROVIDERS:-}
      GO_SERVER_LONGBRIDGE_HISTORY_ENABLED: ${GO_SERVER_LONGBRIDGE_HISTORY_ENABLED:-false}
      GO_SERVER_LONGBRIDGE_DEPTH_ENABLED: ${GO_SERVER_LONGBRIDGE_DEPTH_ENABLED:-false}
      LONGBRIDGE_APP_KEY: ${LONGBRIDGE_APP_KEY:-}
      LONGBRIDGE_APP_SECRET: ${LONGBRIDGE_APP_SECRET:-}
      LONGBRIDGE_ACCESS_TOKEN: ${LONGBRIDGE_ACCESS_TOKEN:-}
      GO_SERVER_BINANCE_ENABLED: ${GO_SERVER_BINANCE_ENABLED:-false}
      BINANCE_REST_BASE_URL: ${BINANCE_REST_BASE_URL:-https://data-api.binance.vision}
      BINANCE_WS_URL: ${BINANCE_WS_URL:-wss://data-stream.binance.vision}
      GO_SERVER_CLICKHOUSE_ENABLED: ${GO_SERVER_CLICKHOUSE_ENABLED:-false}
      CLICKHOUSE_URL: ${CLICKHOUSE_URL:-}
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-market}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-market}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      GO_SERVER_CLICKHOUSE_RETENTION: ${GO_SERVER_CLICKHOUSE_RETENTION:-43800h}
      GO_SERVER_CLICKHOUSE_CLEANUP_INTERVAL: ${GO_SERVER_CLICKHOUSE_CLEANUP_INTERVAL:-720h}
      GO_SERVER_REDIS_ENABLED: ${GO_SERVER_REDIS_ENABLED:-false}
      GO_SERVER_REDIS_ADDRESS: ${GO_SERVER_REDIS_ADDRESS:-}
      GO_SERVER_REDIS_USERNAME: ${GO_SERVER_REDIS_USERNAME:-}
      GO_SERVER_REDIS_PASSWORD: ${GO_SERVER_REDIS_PASSWORD:-}
      GO_SERVER_REDIS_DB: ${GO_SERVER_REDIS_DB:-0}
      GO_SERVER_REDIS_TTL: ${GO_SERVER_REDIS_TTL:-24h}
      GO_SERVER_MARKET_HISTORY_SYNC_ENABLED: ${GO_SERVER_MARKET_HISTORY_SYNC_ENABLED:-false}
      GO_SERVER_MARKET_HISTORY_SYNC_INTERVAL: ${GO_SERVER_MARKET_HISTORY_SYNC_INTERVAL:-24h}
    volumes:
      - server-data:/data
    ports: ["127.0.0.1:17601:17601"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    restart: unless-stopped

  go-client:
    profiles: [local]
    image: market-bridge-client:${IMAGE_TAG:-local}
    build:
      context: .
      target: go-client
    environment:
      GO_CLIENT_LISTEN: 0.0.0.0:17600
      GO_CLIENT_CACHE_DIRECTORY: /data
      GO_CLIENT_SERVER_URL: ${GO_CLIENT_SERVER_URL:?set GO_CLIENT_SERVER_URL in .env}
      GO_CLIENT_SERVER_TOKEN: ${GO_CLIENT_SERVER_TOKEN:?set GO_CLIENT_SERVER_TOKEN in .env}
      GO_CLIENT_PARQUET_TTL: ${GO_CLIENT_PARQUET_TTL:-720h}
      GO_CLIENT_CLEANUP_INTERVAL: ${GO_CLIENT_CLEANUP_INTERVAL:-6h}
      GO_CLIENT_REDIS_ENABLED: ${GO_CLIENT_REDIS_ENABLED:-true}
      GO_CLIENT_REDIS_ADDRESS: ${GO_CLIENT_REDIS_ADDRESS:-redis:6379}
      GO_CLIENT_REDIS_USERNAME: ${GO_CLIENT_REDIS_USERNAME:-}
      GO_CLIENT_REDIS_PASSWORD: ${GO_CLIENT_REDIS_PASSWORD:-${REDIS_PASSWORD:-}}
      GO_CLIENT_REDIS_DB: ${GO_CLIENT_REDIS_DB:-0}
      GO_CLIENT_REDIS_TTL: ${GO_CLIENT_REDIS_TTL:-24h}
      GO_CLIENT_NEWS_RETENTION: ${GO_CLIENT_NEWS_RETENTION:-720h}
      GO_CLIENT_CLICKHOUSE_ENABLED: ${GO_CLIENT_CLICKHOUSE_ENABLED:-false}
      GO_CLIENT_CLICKHOUSE_COMPLETED_BARS_ONLY: ${GO_CLIENT_CLICKHOUSE_COMPLETED_BARS_ONLY:-true}
      GO_CLIENT_CLICKHOUSE_RETENTION: ${GO_CLIENT_CLICKHOUSE_RETENTION:-43800h}
      GO_CLIENT_CLICKHOUSE_CLEANUP_INTERVAL: ${GO_CLIENT_CLICKHOUSE_CLEANUP_INTERVAL:-720h}
      GO_CLIENT_STORAGE_CAPABILITY_INTERVAL: ${GO_CLIENT_STORAGE_CAPABILITY_INTERVAL:-5m}
      GO_CLIENT_MARKET_HISTORY_SYNC_ENABLED: ${GO_CLIENT_MARKET_HISTORY_SYNC_ENABLED:-false}
      GO_CLIENT_MARKET_HISTORY_SYNC_INTERVAL: ${GO_CLIENT_MARKET_HISTORY_SYNC_INTERVAL:-24h}
      CLICKHOUSE_URL: ${GO_CLIENT_CLICKHOUSE_URL:-http://clickhouse:8123}
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-market}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-market}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
    ports: ["127.0.0.1:17600:17600"]
    volumes:
      - client-data:/data
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      clickhouse:
        condition: service_healthy
        required: false
    restart: unless-stopped

  redis:
    profiles: [local, local-redis]
    image: redis:7.4-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_MAXMEMORY: ${REDIS_MAXMEMORY:-1gb}
    command: ["sh", "-c", "test -n \"$$REDIS_PASSWORD\" || { echo 'REDIS_PASSWORD is required for local Redis' >&2; exit 1; }; exec redis-server --save '' --appendonly no --maxmemory \"$$REDIS_MAXMEMORY\" --maxmemory-policy allkeys-lru --requirepass \"$$REDIS_PASSWORD\""]
    expose: [6379]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping 2>/dev/null | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  clickhouse:
    profiles: [clickhouse]
    image: clickhouse/clickhouse-server:${CLICKHOUSE_VERSION:-25.8-alpine}
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-market}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-market}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-change-me}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports: ["127.0.0.1:${CLICKHOUSE_HTTP_PORT:-18123}:8123"]
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    mem_limit: ${CLICKHOUSE_MEMORY_LIMIT:-2g}
    cpus: ${CLICKHOUSE_CPUS:-2}
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user \"$$CLICKHOUSE_USER\" --password \"$$CLICKHOUSE_PASSWORD\" --query 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

volumes:
  server-data:
  client-data:
  clickhouse-data:
